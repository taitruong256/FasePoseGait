data_cfg:
  dataset_name: CASIA-B
  dataset_root: /home/HardDisk/Tai/CASIA-B_HRNet
  dataset_partition: ./datasets/CASIA-B/CASIA-B.json
  test_dataset_name: CASIA-B
  num_workers: 4
  remove_no_gallery: false
  frame_threshold: 0

evaluator_cfg:
  enable_float16: false
  restore_ckpt_strict: true
  restore_hint: 10000
  save_name: ProtoGCN
  eval_func: evaluate_indoor_dataset
  sampler: {batch_size: 1, sample_type: fixed_ordered, type: InferenceSampler, frames_num_fixed: 100, temporal_sampler: protogcn, temporal_test_mode: true, num_clips: 10}
  metric: euc
  transform:
    - type: SkeletonInput

loss_cfg:
  - type: CrossEntropyLoss
    scale: 1
    label_smooth: false
    log_prefix: cross_entropy
  - type: ClassSpecificContrastiveLoss
    model_managed: true
    log_prefix: csc
    num_classes: 74
    input_dim: 289
    hidden_dim: 256
    temperature: 0.125
    momentum: 0.9
    loss_term_weight: 0.2

model_cfg:
  model: ProtoGCN
  log_pose: false
  num_class: 74
  view_loss_weight: 1.0
  view_step: 18
  random_rotation_theta: 0.2
  backbone_cfg:
    in_channels: 3
    base_channels: 96
    ch_ratio: 2
    num_stages: 10
    inflate_stages: [5, 8]
    down_stages: [5, 8]
    data_bn_type: VC
    num_person: 1
    num_prototype: 300
    view_num: 11
    num_joints: 17
    tcn_ms_cfg: [[3, 1], [3, 2], [3, 3], [3, 4], [max, 3], 1x1]
    graph_cfg: {layout: coco, mode: random, num_filter: 8, init_off: 0.04, init_std: 0.02}

optimizer_cfg: {lr: 0.025, momentum: 0.9, nesterov: true, solver: SGD, weight_decay: 0.0005}
scheduler_cfg: {scheduler: CosineAnnealingLR, T_max: auto, eta_min: 0}

trainer_cfg:
  enable_float16: false 
  cuda_deterministic: false
  log_iter: 100
  fix_BN: false
  with_test: true
  restore_ckpt_strict: false
  restore_hint: 0
  save_iter: 2000
  save_name: ProtoGCN_10stage_simulate
  sync_BN: false
  total_epoch: 200
  sampler:
    batch_shuffle: true
    batch_size: 16
    frames_num_fixed: 100
    frames_num_max: 50
    frames_num_min: 25
    sample_type: fixed_ordered
    frames_skip_num: 0
    type: EpochBatchSampler
    temporal_sampler: protogcn
  transform:
    # There is one pose input modality.  Its augmentation pipeline must be a
    # single transform (Compose), not four transforms for four modalities.
    - type: Compose
      trf_cfg:
        - type: RandomRot_ProtoGCN
          theta: 0.2
        - type: SpatialFlip_ProtoGCN
          p: 0.5
        - type: PartDrop_ProtoGCN
          p: 0.2
        - type: SkeletonInput
