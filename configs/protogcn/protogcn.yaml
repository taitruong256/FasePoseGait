data_cfg:
  dataset_name: CASIA-B
  dataset_root: /home/HardDisk/Tai/CASIA-B_HRNet
  dataset_partition: ./datasets/CASIA-B/CASIA-B.json
  test_dataset_name: CASIA-B
  num_workers: 1
  remove_no_gallery: false
  frame_threshold: 0

evaluator_cfg:
  enable_float16: false
  restore_ckpt_strict: true
  restore_hint: 2000
  save_name: ProtoGCN
  eval_func: evaluate_indoor_dataset
  # Match the original ProtoGCN test loader and avoid packing several
  # variable-length sequences into one temporal tensor during evaluation.
  sampler: {batch_size: 1, sample_type: all_ordered, type: InferenceSampler}
  metric: euc
  transform:
    - type: SkeletonInput

loss_cfg:
  - type: CrossEntropyLoss
    scale: 1
    label_smooth: false
    log_prefix: cross_entropy
  - type: ClassSpecificContrastiveLoss
    model_managed: true
    log_prefix: csc
    num_classes: 74
    input_dim: 289
    hidden_dim: 256
    temperature: 0.125
    momentum: 0.9
    loss_term_weight: 0.2

model_cfg:
  model: ProtoGCN
  log_pose: false
  num_class: 74
  view_loss_weight: 1.0
  view_step: 18
  random_rotation_theta: 0.2
  backbone_cfg:
    in_channels: 3
    base_channels: 64
    ch_ratio: 2
    num_stages: 4
    inflate_stages: [3, 4]
    down_stages: [3, 4]
    data_bn_type: VC
    num_person: 1
    num_prototype: 300
    view_num: 11
    num_joints: 17
    tcn_ms_cfg: [[3, 1], [3, 2], [3, 3], [3, 4], [max, 3], 1x1]
    graph_cfg: {layout: coco, mode: random, num_filter: 8, init_off: 0.04, init_std: 0.02}

optimizer_cfg: {lr: 0.025, momentum: 0.9, nesterov: true, solver: SGD, weight_decay: 0.0005}
scheduler_cfg: {scheduler: CosineAnnealingLR, T_max: 101800, eta_min: 0}

trainer_cfg:
  enable_float16: false 
  cuda_deterministic: false
  log_iter: 50
  with_test: true
  restore_ckpt_strict: false
  restore_hint: 0
  save_iter: 500
  save_name: ProtoGCN
  # SyncBatchNorm has no benefit with --nproc_per_node=1.
  sync_BN: false
  total_iter: 101800
  sampler:
    batch_shuffle: false
    # Match the original ProtoGCN global batch of 16 sequence clips.
    batch_size: 16
    frames_num_fixed: 60
    frames_num_max: 50
    frames_num_min: 25
    sample_type: fixed_ordered
    frames_skip_num: 0
    type: CommonSampler
    uniform_sample: true
  transform:
    - type: SkeletonInput
