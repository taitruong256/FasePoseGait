data_cfg:
  dataset_name: CASIA-B
  dataset_root: your_path
  dataset_partition: ./datasets/CASIA-B/CASIA-B.json
  test_dataset_name: CASIA-B
  num_workers: 1
  remove_no_gallery: false
  frame_threshold: 0

evaluator_cfg:
  enable_float16: false
  restore_ckpt_strict: true
  restore_hint: 0
  save_name: ProtoGCN
  eval_func: evaluate_indoor_dataset
  sampler:
    batch_size: 4
    sample_type: all_ordered
    type: InferenceSampler
  metric: euc
  transform:
    - type: Compose
      trf_cfg:
        - type: SkeletonInput

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.3
    type: TripletLoss
    log_prefix: triplet
    is_hard_loss: true
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true
    label_smooth: false
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: view_softmax
    log_accuracy: true
    label_smooth: false

model_cfg:
  model: ProtoGCN
  in_channels: 3
  num_class: 74
  view_num: 11
  view_loss_weight: 1.0
  num_prototype: 300
  base_channels: 96
  ch_ratio: 2
  num_stages: 10
  inflate_stages:
    - 5
    - 8
  down_stages:
    - 5
    - 8
  data_bn_type: VC
  num_person: 1
  dropout: 0.1
  graph_cfg:
    joint_format: coco
    max_hop: 3
  tcn_ms_cfg:
    - [3, 1]
    - [3, 2]
    - [3, 3]
    - [3, 4]
    - ['max', 3]
    - '1x1'

optimizer_cfg:
  lr: 0.001
  solver: Adam
  weight_decay: 0.00002

scheduler_cfg:
  three_phase: true
  max_lr: 0.001
  div_factor: 100
  final_div_factor: 1000.0
  total_steps: 40000
  pct_start: 0.475
  scheduler: OneCycleLR

trainer_cfg:
  enable_float16: false
  log_iter: 100
  with_test: true
  restore_ckpt_strict: false
  restore_hint: 0
  save_iter: 1000
  save_name: ProtoGCN
  sync_BN: true
  total_iter: 40000
  sampler:
    batch_shuffle: false
    batch_size:
      - 4
      - 16
    frames_num_fixed: 60
    frames_num_max: 50
    frames_num_min: 25
    sample_type: fixed_ordered
    frames_skip_num: 0
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: PointNoise
          std: 0.3
        - type: InversePosesPre
          probability: 0.1
        - type: JointNoise
          std: 0.3
        - type: SkeletonInput
