data_cfg:
  dataset_name: CASIA-B
  dataset_root: /kaggle/input/datasets/taitruong256/casia-b-hrnet/CASIA-B_HRNet
  dataset_partition: ./datasets/CASIA-B/CASIA-B.json
  test_dataset_name: CASIA-B
  num_workers: 1
  remove_no_gallery: false
  frame_threshold: 0

evaluator_cfg:
  enable_float16: false
  restore_ckpt_strict: true
  restore_hint: 0
  save_name: ProtoGCN
  eval_func: evaluate_indoor_dataset
  sampler:
    batch_size: 1
    sample_type: all_ordered
    type: InferenceSampler
  metric: euc
  transform:
    - type: Compose
      trf_cfg:
        - type: SkeletonInput

loss_cfg:
  - type: TripletLoss
    margin: 0.3
    log_prefix: triplet
    is_hard_loss: true
    loss_term_weight: 1 
  - type: CrossEntropyLoss
    scale: 16
    label_smooth: true
    eps: 0.1
    log_prefix: softmax
    loss_term_weight: 1.0
  - type: ClassSpecificContrastiveLoss
    n_class: 74
    n_channel: 289
    h_channel: 256
    tmp: 0.125
    mom: 0.9
    pred_threshold: 0.0
    log_prefix: csc
    loss_term_weight: 0.2

model_cfg:
  model: ProtoGCNTriplet
  joint_format: coco
  in_channels: 3
  num_class: 74
  base_channels: 32
  ch_ratio: 2
  num_stages: 6
  inflate_stages:
    - 3
    - 5
  down_stages:
    - 3
    - 5
  view_num: 11
  branch_embed_dim: 64
  fusion_embed_dim: 128
  num_prototype: 100
  prn_dropout: 0.1
  max_hop: 2

optimizer_cfg:
  lr: 0.001
  solver: Adam
  weight_decay: 0.00002

scheduler_cfg:
  three_phase: True
  max_lr: 0.001
  div_factor: 100
  final_div_factor: 1000.0
  total_steps: 20000
  pct_start: 0.475
  scheduler: OneCycleLR

trainer_cfg:
  enable_float16: false
  log_iter: 100 
  with_test: true
  restore_ckpt_strict: false
  restore_hint: 0
  save_iter: 1000
  save_name: ProtoGCN
  sync_BN: false
  total_iter: 20000
  sampler:
    batch_shuffle: false
    batch_size:
      - 4
      - 64 
    frames_num_fixed: 60
    frames_num_max: 50
    frames_num_min: 25
    sample_type: fixed_ordered
    frames_skip_num: 0
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: PointNoise
          std: 0.3
        - type: InversePosesPre
          probability: 0.1
        - type: JointNoise
          std: 0.3
        - type: SkeletonInput
